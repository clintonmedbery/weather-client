# This compose file is meant for development use only. Not for prod
# Run from the repo root: docker compose -f docker/docker-compose.yml up
services:
    weather-client:
        image: node:24
        volumes:
            - ..:/weather-client:cached
            # Keep the container's Linux node_modules separate from the host's
            - /weather-client/node_modules
        working_dir: /weather-client
        environment:
            - NODE_ENV=development
        ports:
            - 3000:3000
        command: bash -c "yarn install && yarn dev --host"
